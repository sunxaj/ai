<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane in Universe</title>
    <link rel="stylesheet" href="navbar.css">
    <script src="navbar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #plane {
            width: 50px;
            height: 50px;
            background-image: url('https://img.icons8.com/ios-filled/50/ffffff/paper-plane.png');
            background-size: contain;
            background-repeat: no-repeat;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .celestial {
            position: absolute;
            border-radius: 50%;
        }

        .star {
            background-color: #FFF;
        }

        .planet {
            background-color: #8B4513; /* SaddleBrown */
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 3em;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="plane"></div>
    <div id="game-over">Game Over</div>
</div>

<script>
    const plane = document.getElementById('plane');
    const gameContainer = document.getElementById('game-container');
    const gameOverMessage = document.getElementById('game-over');
    const planeSpeed = 15;
    const backgroundSpeed = 2;
    let planeX = window.innerWidth / 4; // Start plane on the left side
    let planeY = window.innerHeight / 2;
    let gameOver = false;
    const celestialBodies = [];

    plane.style.left = `${planeX}px`;
    plane.style.top = `${planeY}px`;

    function createCelestialBody() {
        const body = document.createElement('div');
        body.classList.add('celestial');
        const isStar = Math.random() > 0.3;
        const size = isStar ? Math.random() * 3 + 1 : Math.random() * 30 + 10;
        const speed = isStar ? backgroundSpeed : backgroundSpeed * 0.5;

        body.classList.add(isStar ? 'star' : 'planet');
        body.style.width = `${size}px`;
        body.style.height = `${size}px`;

        const bodyData = {
            element: body,
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            speed: speed
        };

        body.style.left = `${bodyData.x}px`;
        body.style.top = `${bodyData.y}px`;

        gameContainer.appendChild(body);
        celestialBodies.push(bodyData);
    }

    for (let i = 0; i < 100; i++) {
        createCelestialBody();
    }

    document.addEventListener('keydown', (e) => {
        switch (e.key) {
            case 'ArrowUp': planeY -= planeSpeed; break;
            case 'ArrowDown': planeY += planeSpeed; break;
            case 'ArrowLeft': planeX -= planeSpeed; break;
            case 'ArrowRight': planeX += planeSpeed; break;
        }
        // Prevent plane from going off-screen
        planeX = Math.max(0, Math.min(window.innerWidth - plane.offsetWidth, planeX));
        planeY = Math.max(0, Math.min(window.innerHeight - plane.offsetHeight, planeY));

        plane.style.left = `${planeX}px`;
        plane.style.top = `${planeY}px`;
    });

    function updateGame() {
        if (gameOver) return;

        // Move celestial bodies
        for (const body of celestialBodies) {
            body.x -= body.speed;
            if (body.x < -50) { // Reset when off-screen
                body.x = window.innerWidth + 50;
                body.y = Math.random() * window.innerHeight;
            }
            body.element.style.left = `${body.x}px`;
            body.element.style.top = `${body.y}px`;
        }

        checkCollision();
        requestAnimationFrame(updateGame);
    }

    function checkCollision() {
        const planeRect = plane.getBoundingClientRect();

        // Only check planets for collision, not small stars
        for (const body of document.querySelectorAll('.planet')) {
            const bodyRect = body.getBoundingClientRect();
            if (
                planeRect.left < bodyRect.right &&
                planeRect.right > bodyRect.left &&
                planeRect.top < bodyRect.bottom &&
                planeRect.bottom > bodyRect.top
            ) {
                gameOver = true;
                gameOverMessage.style.display = 'block';
                plane.style.display = 'none';
                break;
            }
        }
    }

    updateGame(); // Start the game loop
</script>

</body>
</html>
