<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Videos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;min-height:100vh}
    h1{font-size:17px;font-weight:600;padding:16px;color:#fff;letter-spacing:.3px}
    #list{display:flex;flex-direction:column;gap:1px;background:#1c1c1e}
    .item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .item:active{background:#1c1c1e}
    .thumb{width:80px;height:50px;border-radius:6px;object-fit:cover;background:#1c1c1e;flex-shrink:0}
    .thumb-placeholder{width:80px;height:50px;border-radius:6px;background:#1c1c1e;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
    .name{font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #empty{padding:32px 16px;color:#636366;font-size:14px;text-align:center}

    /* fullscreen overlay */
    #overlay{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;align-items:center;justify-content:center}
    #overlay.show{display:flex}
    #vplayer{width:100%;max-height:100vh;outline:none}
    #close{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
  <h1>▶ Videos</h1>
  <div id="list"></div>
  <div id="empty" style="display:none">No videos found.</div>

  <div id="overlay">
    <button id="close">✕</button>
    <video id="vplayer" controls playsinline></video>
  </div>

  <script>
    const list = document.getElementById('list');
    const overlay = document.getElementById('overlay');
    const vplayer = document.getElementById('vplayer');

    function play(src) {
      vplayer.src = src;
      overlay.classList.add('show');
      vplayer.play();
      if (vplayer.requestFullscreen) vplayer.requestFullscreen();
      else if (vplayer.webkitEnterFullscreen) vplayer.webkitEnterFullscreen();
    }

    document.getElementById('close').addEventListener('click', () => {
      vplayer.pause();
      if (document.exitFullscreen) document.exitFullscreen();
      overlay.classList.remove('show');
      vplayer.src = '';
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) overlay.classList.remove('show');
    });

    fetch('/list-videos')
      .then(r => r.json())
      .then(files => {
        if (!files.length) { document.getElementById('empty').style.display = 'block'; return; }
        files.forEach(path => {
          const name = path.split('/').pop();
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `<div class="thumb-placeholder">🎬</div><div class="name">${name}</div>`;
          div.addEventListener('click', () => play(path));
          list.appendChild(div);
          generateThumb(path, div.querySelector('.thumb-placeholder'));
        });
      })
      .catch(() => { document.getElementById('empty').style.display = 'block'; });

    function generateThumb(src, placeholder) {
      const vid = document.createElement('video');
      vid.src = src;
      vid.muted = true;
      vid.playsInline = true;
      vid.preload = 'metadata';
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = Math.min(3, vid.duration * 0.1); });
      vid.addEventListener('seeked', () => {
        const canvas = document.createElement('canvas');
        canvas.width = 160; canvas.height = 100;
        canvas.getContext('2d').drawImage(vid, 0, 0, 160, 100);
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = canvas.toDataURL('image/jpeg', 0.7);
        placeholder.replaceWith(img);
        vid.src = '';
      }, {once: true});
    }
  </script>
</body>
</html>
