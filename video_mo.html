<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Videos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f0f;color:#f1f1f1;font-family:Roboto,Arial,sans-serif;min-height:100vh}

    header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#0f0f0f;position:sticky;top:0;z-index:10;border-bottom:1px solid #272727}
    header svg{width:24px;height:24px;fill:#ff0000}
    header span{font-size:18px;font-weight:700;letter-spacing:-0.5px;color:#f1f1f1}

    #list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 4px;padding:8px 4px}
    @media(min-width:768px){#list{grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:16px 8px}}
    @media(min-width:1200px){#list{grid-template-columns:repeat(6,1fr);gap:20px 12px;padding:24px 12px}}
    .item{display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;gap:8px}
    .item:active .thumb-wrap{opacity:0.8}

    .thumb-wrap{position:relative;width:100%;aspect-ratio:3/5;background:#272727;overflow:hidden}
    .thumb-wrap video.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
    .thumb-wrap.playing video.preview{display:block}
    .thumb{width:100%;height:100%;object-fit:cover;display:block}
    .thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#272727}
    .thumb-placeholder svg{width:48px;height:48px;fill:#717171}

    .meta{display:flex;flex-direction:column;gap:4px;padding:0 4px}
    .title{font-size:13px;font-weight:500;color:#f1f1f1;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
    .sub{font-size:11px;color:#aaa}

    #empty{padding:48px 16px;color:#717171;font-size:14px;text-align:center}

    #overlay{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;align-items:center;justify-content:center}
    #overlay.show{display:flex}
    #vplayer{width:100%;max-height:100vh;outline:none}
    #close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>

<header>
  <svg viewBox="0 0 24 24"><path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.2 5 12 5 12 5s-4.2 0-7 .1c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.7 2.2.8C6.8 19 12 19 12 19s4.2 0 7-.2c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"/></svg>
  <span>Videos</span>
</header>

<div id="list"></div>
<div id="empty" style="display:none">No videos found.</div>

<div id="overlay">
  <button id="close">✕</button>
  <video id="vplayer" controls playsinline></video>
</div>

<script>
  const list = document.getElementById('list');
  const overlay = document.getElementById('overlay');
  const vplayer = document.getElementById('vplayer');

  function play(src) {
    vplayer.src = src;
    overlay.classList.add('show');
    vplayer.play();
    if (vplayer.requestFullscreen) vplayer.requestFullscreen();
    else if (vplayer.webkitEnterFullscreen) vplayer.webkitEnterFullscreen();
  }

  document.getElementById('close').addEventListener('click', () => {
    vplayer.pause();
    if (document.exitFullscreen) document.exitFullscreen();
    overlay.classList.remove('show');
    vplayer.src = '';
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) overlay.classList.remove('show');
  });

  const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

  fetch('/list-videos')
    .then(r => r.json())
    .then(files => {
      if (!files.length) { document.getElementById('empty').style.display = 'block'; return; }
      files.forEach(path => {
        const name = path.split('/').pop().replace(/\.mp4$/i, '');
        const initial = name[0] || 'V';
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="thumb-wrap">
            <div class="thumb-placeholder">${playIcon}</div>
            <video class="preview" muted loop playsinline preload="none"></video>
          </div>
          <div class="meta">
            <div class="title">${name}</div>
            <div class="sub">Local video</div>
          </div>`;
        
        const thumbWrap = div.querySelector('.thumb-wrap');
        const previewVid = div.querySelector('video.preview');
        previewVid.src = path;
        
        let hoverTimer = null;
        thumbWrap.addEventListener('mouseenter', () => {
          hoverTimer = setTimeout(() => {
            thumbWrap.classList.add('playing');
            previewVid.play().catch(() => {});
          }, 500);
        });
        
        thumbWrap.addEventListener('mouseleave', () => {
          if (hoverTimer) clearTimeout(hoverTimer);
          thumbWrap.classList.remove('playing');
          previewVid.pause();
          previewVid.currentTime = 0;
        });
        
        div.addEventListener('click', () => play(path));
        list.appendChild(div);
        generateThumb(path, div.querySelector('.thumb-placeholder'));
      });
    })
    .catch(() => { document.getElementById('empty').style.display = 'block'; });

  function generateThumb(src, placeholder) {
    const vid = document.createElement('video');
    vid.src = src;
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = 'metadata';
    vid.addEventListener('loadedmetadata', () => { vid.currentTime = Math.min(3, vid.duration * 0.1); });
    vid.addEventListener('seeked', () => {
      const canvas = document.createElement('canvas');
      canvas.width = 600; canvas.height = 1000;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 600, 1000);
      
      const vw = vid.videoWidth;
      const vh = vid.videoHeight;
      const scale = Math.min(600 / vw, 1000 / vh);
      const w = vw * scale;
      const h = vh * scale;
      const x = (600 - w) / 2;
      const y = (1000 - h) / 2;
      
      ctx.drawImage(vid, x, y, w, h);
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = canvas.toDataURL('image/jpeg', 0.8);
      placeholder.replaceWith(img);
      vid.src = '';
    }, {once: true});
  }
</script>
</body>
</html>
